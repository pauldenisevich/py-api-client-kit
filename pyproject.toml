[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "api-client-kit"
version = "0.0.0"
description = "Opinionated toolkit for building robust Python API clients."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Paul Denisevich" }]
keywords = [
  "api-client",
  "httpx",
  "sdk",
  "retries",
  "pagination",
  "redaction",
  "python",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.0",
  "ruff>=0.12",
  "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/pauldenisevich/py-api-client-kit"
Repository = "https://github.com/pauldenisevich/py-api-client-kit"
Issues = "https://github.com/pauldenisevich/py-api-client-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["api_client_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "unit: Fast isolated unit tests with no external services",
  "integration: Integration tests using local transports or test doubles",
]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["api_client_kit", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PT",
  "RET",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
